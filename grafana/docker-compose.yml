services:   
  grafana:
    image: grafana/grafana
    container_name: server-grafana
    user: "472:472"  
    restart: unless-stopped
    # ports:
    #   - 8002:3000 
    networks:
      - default   
      - web
    
    # environment:
    #   GF_SERVER_ROOT_URL: https://grafana.apron5.com
    volumes:
#        - '/var/buyuvit/grafana/grafana.ini:/etc/grafana/grafana.ini'
        - './grafana/data:/var/lib/grafana:rw'
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.grafana.rule=Host(`grafana.apron5.com`)"
    #   - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    #   - "traefik.http.routers.grafana.entrypoints=websecure"
    #   - "traefik.http.routers.grafana.tls=true"      
  prometheus:
    image: prom/prometheus
    container_name: server-prometheus
    volumes:
      - ./grafana/configs/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
  node_exporter:
    image: prom/node-exporter
    container_name: server-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped  


networks:
  db: 
    external: true
  web: 
    external: true
